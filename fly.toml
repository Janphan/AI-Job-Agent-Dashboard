# fly.toml app configuration file generated for ai-job-agent-dashboard on 2026-06-15T16:31:19+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-job-agent-dashboard'
primary_region = 'arn'

[build.args]
VITE_API_URL = "https://backend-ai-job-agent-dashboard.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
